<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient: dark navy -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e2f52"/>
      <stop offset="100%" stop-color="#0e1929"/>
    </linearGradient>
    <!-- Blue frame gradient: cornflower blue top-left to deeper blue bottom-right -->
    <linearGradient id="blueGrad" x1="170" y1="188" x2="768" y2="838" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5f9ef5"/>
      <stop offset="100%" stop-color="#2c65c8"/>
    </linearGradient>
    <!-- Subtle shadow filter for depth on dark inner area -->
    <filter id="innerShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ── Background: dark navy rounded square ── -->
  <rect width="1024" height="1024" rx="210" ry="210" fill="url(#bgGrad)"/>

  <!-- ── Handle: D-shaped thick arc on the left side ── -->
  <!-- Drawn BEFORE the main body so the body sits on top at the junction -->
  <path d="M 275,378 C 205,378 168,412 168,462 C 168,512 205,546 275,546"
        stroke="url(#blueGrad)" stroke-width="52" fill="none"
        stroke-linecap="butt"/>

  <!-- Handle connection dots (rivets) where handle meets body -->
  <circle cx="270" cy="378" r="19" fill="url(#blueGrad)"/>
  <circle cx="270" cy="546" r="19" fill="url(#blueGrad)"/>

  <!-- ── Main blue frame body ── -->
  <rect x="268" y="188" width="500" height="650" rx="76" ry="76" fill="url(#blueGrad)"/>

  <!-- ── Inner dark screen / card area ── -->
  <rect x="307" y="228" width="422" height="570" rx="54" ry="54" fill="#0b1421"/>

  <!-- ── White tilde wave (top) ── -->
  <!-- Two S-curve cycles, white, representing ≈ (approximately equal / spaced repetition) -->
  <path d="M 355,445
           C 382,410 412,410 438,445
           C 465,480 494,480 520,445
           C 547,410 576,410 603,445
           C 630,480 653,473 665,462"
        stroke="#FFFFFF" stroke-width="30" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── Gray tilde wave (bottom) ── -->
  <!-- Same shape, offset down, mid-gray -->
  <path d="M 355,518
           C 382,483 412,483 438,518
           C 465,553 494,553 520,518
           C 547,483 576,483 603,518
           C 630,553 653,546 665,535"
        stroke="#7b8fa8" stroke-width="30" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
